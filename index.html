<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>my_movie_edit</title>
    <style>
      body { margin: 0; padding: 0 16px 32px; font-family: system-ui, sans-serif; background: #111; color: #eee; }
      h1 { font-size: 18px; }
      video { width: 100%; background: #000; border-radius: 8px; }
      button { font-size: 16px; padding: 12px 16px; border-radius: 8px; border: 0; background: #2a6df4; color: #fff; }
      button:disabled { background: #444; color: #888; }
      #mark { width: 100%; height: 88px; font-size: 24px; margin: 8px 0; background: #e5484d; }
      #mark:disabled { background: #444; }
      input { width: 56px; font-size: 16px; padding: 6px; }
      .row { display: flex; gap: 12px; align-items: center; margin: 8px 0; }
      pre { white-space: pre-wrap; font-size: 12px; }
      .clip { margin-bottom: 16px; }
      td { padding: 2px 8px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
